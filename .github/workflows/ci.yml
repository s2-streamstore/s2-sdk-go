name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

env:
  CLICOLOR: 1

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: none
    name: CI
    needs: [examples, test, s2-integration, s2-lite-integration, fault-tests, golangci-lint, bento-integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')

  specsync:
    name: Spec doc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Check spec doc drift
        run: go run ./internal/specsync

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.40.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup protoc
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Build
        run: |
          for eg in `go list ./examples/... | sed 's|.*/||'`; do
            echo "Building '$eg' example"
            task eg:build NAME=$eg
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.40.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup protoc
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Test
        run: task test

  s2-integration:
    name: S2 Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.40.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup protoc
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - name: Integration tests
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
          S2_ACCOUNT_ENDPOINT: ${{ secrets.S2_ACCOUNT_ENDPOINT }}
          S2_BASIN_ENDPOINT: ${{ secrets.S2_BASIN_ENDPOINT }}
        run: task test:integration

  build-s2-lite:
    name: Build S2-lite
    uses: s2-streamstore/s2/.github/workflows/build-s2-lite.yml@bf8f49ed64362e30a83fbdc43581a55010906e5f # main 2026-10-30

  fault-tests:
    name: SDK correctness
    needs: build-s2-lite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure fault harness
        run: |
          {
            echo "S2_LITE_BIN=$RUNNER_TEMP/s2-lite/server"
            echo "S2_FAULT_OUTPUT=$RUNNER_TEMP/sdk-faults"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-binary
          path: ${{ runner.temp }}/s2-lite
      - name: Test Lite fault harness
        run: |
          chmod +x "$S2_LITE_BIN"
          go test -race -count=1 -timeout=3m ./internal/faulttest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sdk-faults
          path: |
            ${{ runner.temp }}/sdk-faults

  s2-lite-integration:
    name: S2-lite Integration
    needs: build-s2-lite
    uses: s2-streamstore/s2/.github/workflows/sdk-tests.yml@bf8f49ed64362e30a83fbdc43581a55010906e5f # main 2026-10-30
    with:
      server-binary: server
      server-args: "--port 8080"
      server-port: 8080
      sdks: |
        [
          {
            "name": "go",
            "repo": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "lang": "go",
            "go-version": "1.26",
            "test_cmd": "go test -v -timeout 10m -count=1 -skip 'Locations|WithLocation|WithDefaultLocation|Metrics|AccessToken|Client_InvalidToken' ./s2/..."
          },
          {
            "name": "go-bentobox",
            "repo": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "lang": "go",
            "go-version": "1.26",
            "test_cmd": "go test -v -timeout 5m -count=1 ./s2-bentobox/..."
          }
        ]

  golangci-lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.1.6
          install-mode: goinstall

  bento-integration:
    name: Bento Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          path: s2-sdk-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: infiniteregrets/bento
          ref: m/update-s2-bentobox
          path: bento
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Setup bento with local s2-sdk-go
        working-directory: bento
        env:
          GOTOOLCHAIN: auto
        run: |
          go mod edit -replace github.com/s2-streamstore/s2-sdk-go=../s2-sdk-go
          go mod tidy
          go build -o bento ./cmd/bento
      - name: Create test basin
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
        working-directory: s2-sdk-go
        run: |
          BASIN_NAME=$(go run ./s2-bentobox/testdata/setup create)
          echo "BASIN_NAME=$BASIN_NAME" >> $GITHUB_ENV
          echo "Created basin: $BASIN_NAME"
      - name: Test bento output (write to S2)
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
          BASIN_NAME: ${{ env.BASIN_NAME }}
        working-directory: bento
        run: ./bento run ../s2-sdk-go/s2-bentobox/testdata/ci-output.yaml
      - name: Test bento input (read from S2)
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
          BASIN_NAME: ${{ env.BASIN_NAME }}
        working-directory: bento
        run: |
          timeout 10 ./bento run ../s2-sdk-go/s2-bentobox/testdata/ci-input.yaml 2>&1 | tee output.log || true
          # Verify we got the expected messages
          COUNT=$(grep -c "bento-ci-test" output.log || echo "0")
          if [ "$COUNT" -ge "5" ]; then
            echo "Success: Found $COUNT messages"
          else
            echo "Error: Expected at least 5 messages, got $COUNT"
            exit 1
          fi
      - name: Cleanup test basin
        if: always()
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
        working-directory: s2-sdk-go
        run: go run ./s2-bentobox/testdata/setup delete ${{ env.BASIN_NAME }} || true
