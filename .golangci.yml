version: "2"

linters:
  default: none
  disable:
    - errcheck
    - wsl
    - dupl
    - godot
    - nilnil
    - nlreturn
    - unparam
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - copyloopvar
    - dupl
    - durationcheck
    - exptostd
    - fatcontext
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - godot
    - goprintffuncname
    - grouper
    - importas
    - intrange
    - makezero
    - mirror
    - misspell
    - nilnil
    - nlreturn
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - reassign
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  exclusions:
    rules:
      # x/net/http2 deprecated its Transport in favor of net/http's built-in HTTP/2.
      - linters: [staticcheck]
        text: 'SA1019: .*(deprecated: Use \[http\.|h2c|GoAwayError)'
